# ============================================================================
# Anteprima del sito DGF. Una porta sola: http://localhost:7000
#
#   npm run preview        compila e apre l'anteprima
#   npm run preview:stop   la spegne
#
# Serve il sito con nginx configurato come GitHub Pages: è il modo fedele di
# vedere cosa succederà online PRIMA di pubblicare. Differenze che solo questo
# ambiente mostra, e che il server di sviluppo nasconde:
#   - risoluzione degli indirizzi identica a Pages: /servizi funziona senza
#     barra finale
#   - risposte compresse con gzip, come le serve Pages
#   - pagina 404 del sito al posto di quella di nginx
#   - immagini realmente ottimizzate dalla build, non servite al volo
#
# Per SCRIVERE i contenuti resta utile `npm run dev`, che si ricarica da solo.
# Per GUARDARE il risultato si usa solo questo.
# ============================================================================

services:
  # ── Anteprima di tutti i giorni ────────────────────────────────────────────
  # nginx serve direttamente la cartella dist/ del computer, in sola lettura.
  #
  # Perché montata e non copiata dentro l'immagine: copiandola, ogni modifica
  # a un testo obbligherebbe a ricostruire l'immagine, e ricostruirla rifà
  # `npm ci` dentro il container. Montandola basta `npm run build` e un
  # aggiornamento della pagina. È la differenza fra due secondi e due minuti,
  # ed è il motivo per cui prima si finiva a guardare il container sbagliato.
  preview:
    image: nginx:1.29-alpine
    container_name: dgf-preview
    ports:
      - "7000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 e non "localhost": dentro il container il nome risolve prima
      # su IPv6 (::1), dove nginx non ascolta, e il controllo segnalerebbe
      # "unhealthy" un sito che invece funziona.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      start_period: 3s
      retries: 3

  # ── Verifica prima di pubblicare ──────────────────────────────────────────
  # Compila il sito DENTRO un container Linux pulito, come fa GitHub Actions.
  # Non serve tutti i giorni, ma è l'unica cosa che accorge di dipendenze
  # mancanti per Linux nel package-lock: un errore che sul computer non si
  # vede e che fa fallire il deploy. Si avvia solo se richiesta:
  #
  #   docker compose --profile verifica up --build verifica
  #
  # Su una porta diversa apposta, così non litiga con l'anteprima.
  verifica:
    profiles: ["verifica"]
    build:
      context: .
      target: preview
    container_name: dgf-verifica
    ports:
      - "7001:80"
