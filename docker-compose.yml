# ============================================================================
# Anteprima del sito DGF — un solo comando.
#
#   docker compose up --build     ->  http://localhost:8080
#
# Compila il sito e lo serve con nginx configurato come GitHub Pages. È il
# modo fedele di vedere cosa succederà online PRIMA di pubblicare.
#
# Differenze che solo questo ambiente mostra, e che il server di sviluppo
# nasconde:
#   - risoluzione degli indirizzi identica a Pages: /servizi funziona senza
#     barra finale, e /admin risponde (sul dev server dà 404)
#   - risposte compresse con gzip, come le serve Pages
#   - pagina 404 del sito al posto di quella di nginx
#   - immagini realmente ottimizzate dalla build, non servite al volo
#
# Per lavorare ai contenuti usa invece `npm run dev` (più veloce, si ricarica
# da solo). Questo container serve al controllo finale prima del merge.
# ============================================================================

services:
  preview:
    build:
      context: .
      target: preview
    container_name: dgf-preview
    ports:
      - "8080:80"
    restart: unless-stopped
