# ============================================================================
# nginx che imita GitHub Pages.
#
# Serve a testare il sito come sarà davvero online, non come lo mostra il
# server di sviluppo. Le differenze che contano:
#
#   - GitHub Pages risolve /percorso  ->  /percorso/index.html
#     (il dev server di Astro si comporta diversamente sugli indirizzi senza
#      barra finale — esattamente il tipo di sorpresa che questo container
#      evita)
#   - GitHub Pages comprime le risposte con gzip
#   - GitHub Pages serve 404.html per gli indirizzi inesistenti
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressione, come fa GitHub Pages.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/yaml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Risoluzione degli indirizzi identica a Pages.
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
        # `no-cache` anche QUI, non solo nel blocco ~* \.html$ più sotto:
        # gli indirizzi senza estensione (/, /servizi, …) vengono serviti da
        # QUESTA location, e il blocco regex non li tocca — senza header il
        # browser applicava la cache euristica e durante lo sviluppo si
        # finiva a testare una home VECCHIA credendola l'ultima build.
        # (Successo davvero: il "volo" della scena Nexia sembrava buggato,
        # era una versione precedente rimasta in cache.)
        add_header Cache-Control "no-cache";
    }

    # Pagina 404 del sito, non quella di nginx.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Asset con hash nel nome: possono restare in cache per sempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # L'HTML no: deve poter cambiare al prossimo deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
