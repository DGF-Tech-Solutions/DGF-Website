<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Il pannello non deve finire su Google: è una schermata di accesso. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Redazione — DGF Tech Solutions</title>
  </head>

    <!--
      Sveltia CMS: applicazione a pagina singola servita da CDN.
      Non c'è nessun backend nostro: il pannello parla direttamente con

      scrive il file markdown nel repository, GitHub Actions ribuilda il
      sito e la modifica va online in circa un minuto.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
