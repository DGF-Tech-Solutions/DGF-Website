# ============================================================================
# Sveltia CMS — configurazione del pannello di redazione
#
# Il pannello vive su https://dgftechsolutions.com/admin
# Accesso: "Sign In with Token", incollando un Personal Access Token di GitHub.
#
# COME CREARE IL TOKEN (una volta, poi dura fino alla scadenza che scegli):
#   1. GitHub → Settings → Developer settings
#      → Personal access tokens → Fine-grained tokens → Generate new token
#   2. Repository access → Only select repositories → DGF-Tech-Solutions/DGF-Website
#   3. Permissions → Repository permissions → Contents: Read and write
#   4. Expiration: fino a 366 giorni
#   5. Genera, copia e incolla nel pannello
#
# Quel token apre SOLO questo repository e SOLO i file. Non permette di
# entrare su github.com, né di cambiare la password, né di toccare altro.
# ============================================================================

backend:
  name: github
  repo: DGF-Tech-Solutions/DGF-Website
  branch: main
  # Salva direttamente sul branch (niente flusso di revisione con pull request):
  # per un team di tre persone la PR sarebbe un passaggio a vuoto.
  # Metti "true" se un domani vorrai far approvare gli articoli prima di pubblicarli.
  publish_mode: simple

# Cartella di default per i caricamenti (usata dalle collezioni che non
# definiscono la propria).
#
# Entrambi i percorsi sono ASSOLUTI dalla radice del repository: Sveltia
# rifiuta i percorsi relativi, e Astro risolve comunque "/src/..." grazie a
# Vite. Verificato: le immagini referenziate così vengono ottimizzate
# regolarmente in fase di build.
media_folder: /src/assets/uploads
public_folder: /src/assets/uploads

# Interfaccia in italiano.
locale: it

collections:
  # ══════════════════════════════════════════════════════════════════════
  # BLOG
  # ══════════════════════════════════════════════════════════════════════
  - name: blog
    label: Articoli del blog
    label_singular: Articolo
    description: >-
      Gli articoli pubblicati su /blog. Il nome del file diventa l'indirizzo
      della pagina, quindi scrivilo in minuscolo con i trattini
      (es. "come-scegliere-un-cms").
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    # Ordinamento e ricerca nell'elenco del pannello
    sortable_fields: [date, title]
    view_filters:
      - label: Solo bozze
        field: draft
        pattern: true
    fields:
      - label: Titolo
        name: title
        widget: string
        hint: Massimo 120 caratteri. È anche il titolo che appare su Google.
        pattern: ["^.{1,120}$", "Il titolo non può superare i 120 caratteri"]

      - label: Riassunto
        name: excerpt
        widget: text
        hint: >-
          Due righe. Compaiono nell'elenco del blog e come descrizione nei
          risultati di ricerca. Massimo 320 caratteri.
        pattern: ["^.{1,320}$", "Il riassunto non può superare i 320 caratteri"]

      - label: Data di pubblicazione
        name: date
        widget: datetime
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: false

      - label: Categoria
        name: category
        widget: select
        options: [Guide, Strategia, Tecnica, Notizie]
        default: Guide

      - label: Autore
        name: author
        widget: string
        default: DGF Tech Solutions

      - label: Minuti di lettura
        name: readingTime
        widget: number
        required: false
        value_type: int
        min: 1
        max: 60
        hint: Lascia vuoto e verrà calcolato in automatico dalla lunghezza del testo.

      - label: Bozza
        name: draft
        widget: boolean
        default: false
        hint: Se attivo l'articolo NON compare sul sito. Utile per scrivere con calma.

      - label: Contenuto
        name: body
        widget: markdown
        hint: >-
          Usa "Titolo 2" per le sezioni. I link interni si scrivono così:
          /contatti oppure /servizi/siti-web

  # ══════════════════════════════════════════════════════════════════════
  # PORTFOLIO
  # ══════════════════════════════════════════════════════════════════════
  - name: portfolio
    label: Progetti
    label_singular: Progetto
    description: >-
      I progetti mostrati su /portfolio. Ricorda di indicare correttamente
      se il progetto è dimostrativo o di un cliente reale.
    folder: src/content/portfolio
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    # Le immagini dei progetti stanno insieme agli altri asset ottimizzati
    # da Astro. Percorso assoluto dalla radice del repository: è la forma
    # che accettano sia Sveltia sia le content collections di Astro.
    media_folder: /src/assets/mockups
    public_folder: /src/assets/mockups
    sortable_fields: [order, year, client]
    fields:
      - label: Nome committente
        name: client
        widget: string
        hint: Se il progetto è dimostrativo, è un nome di fantasia.

      - label: Titolo
        name: title
        widget: string
        hint: Orientato al risultato. Massimo 140 caratteri.
        pattern: ["^.{1,140}$", "Il titolo non può superare i 140 caratteri"]

      - label: Riassunto
        name: summary
        widget: text
        pattern: ["^.{1,320}$", "Il riassunto non può superare i 320 caratteri"]

      - label: Categoria
        name: category
        widget: string
        hint: Es. "E-commerce", "Software gestionale", "Sito immobiliare".

      - label: Anno
        name: year
        widget: string
        pattern: ["^[0-9]{4}$", "Inserisci un anno a quattro cifre"]

      - label: Natura del progetto
        name: kind
        widget: select
        options:
          - { label: "Dimostrativo (concept interno)", value: dimostrativo }
          - { label: "Cliente reale (lavoro su commessa)", value: cliente }
        default: dimostrativo
        hint: >-
          IMPORTANTE. "Dimostrativo" mostra in pagina una nota di trasparenza e
          presenta i numeri come obiettivi di progetto. Scegli "Cliente reale"
          solo per lavori realmente commissionati.

      - label: Immagine di anteprima
        name: cover
        widget: image
        hint: Usata nelle schede dell'elenco. Formato consigliato 16:10.

      - label: Immagine grande
        name: coverFull
        widget: image
        required: false
        hint: Mostrata in cima alla pagina del progetto. Se manca si usa l'anteprima.

      - label: Servizi
        name: services
        widget: list
        min: 1
        field: { label: Servizio, name: service, widget: string }

      - label: Tecnologie
        name: stack
        widget: list
        min: 1
        field: { label: Tecnologia, name: tech, widget: string }

      - label: Obiettivi / risultati
        name: metrics
        widget: list
        max: 4
        required: false
        summary: "{{fields.value}} — {{fields.label}}"
        fields:
          - { label: Valore, name: value, widget: string }
          - { label: Didascalia, name: label, widget: string }

      - label: Il problema
        name: challenge
        widget: text

      - label: L'approccio
        name: approach
        widget: list
        min: 1
        field: { label: Passaggio, name: step, widget: text }

      - label: La soluzione
        name: solution
        widget: text

      - label: In evidenza
        name: featured
        widget: boolean
        default: false

      - label: Ordine
        name: order
        widget: number
        value_type: int
        default: 99
        hint: Numero più basso = compare prima nell'elenco.

      - label: Approfondimento
        name: body
        widget: markdown
        hint: Il testo lungo in fondo alla pagina del progetto.
