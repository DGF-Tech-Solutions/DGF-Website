name: Deploy sito su GitHub Pages

# Si avvia a ogni push sul branch principale, oppure manualmente dalla
# tab "Actions" del repo. Anche una modifica fatta direttamente da GitHub
# è un push su main: il sito si aggiorna da solo in circa un minuto.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi richiesti per pubblicare su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy sovrapposti: se ne parte uno nuovo, aspetta quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Astro build NON valida quello che valida `astro check`: un articolo con
      # frontmatter sbagliato o un componente con props errate passerebbe fino
      # in produzione. Trenta secondi qui, invece di un difetto online.
      - name: Controllo tipi e contenuti
        run: npm run check

      - name: Build (export statico in ./dist)
        run: npm run build

      - name: Verifica artefatto
        run: |
          test -f dist/CNAME     || { echo "::error::dist/CNAME mancante: il dominio custom andrebbe perso"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll mancante: GitHub Pages applicherebbe Jekyll"; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html mancante: export non riuscito"; exit 1; }
          test -f dist/404.html  || { echo "::error::dist/404.html mancante: le pagine inesistenti non mostrerebbero la nostra 404"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "::error::sitemap mancante"; exit 1; }
          echo "Artefatto verificato: $(find dist -name '*.html' | wc -l) pagine HTML."

      - name: Prepara l'artefatto per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
